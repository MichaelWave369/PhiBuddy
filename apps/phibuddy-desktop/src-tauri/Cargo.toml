[package]
name = "phibuddy-desktop"
version = "0.6.0-alpha.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Local-first desktop workbench for Buddy, Homie and Dude"
build = "build.rs"

[lib]
name = "phibuddy_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
phibuddy-core = { path = "../../../crates/phibuddy-core" }
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
